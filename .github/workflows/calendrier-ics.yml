name: Actualiser le calendrier ICS ÔGravel
on:
  push:
    branches: [main]
    paths:
      - events.json
      - generer_ics.py
      - helloasso.json
      - .github/workflows/calendrier-ics.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le calendrier
        run: python generer_ics.py
      - name: Enregistrer le calendrier mis à jour
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ogravel.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation automatique du calendrier ICS'
            git push
          fi
