name: Actualiser le calendrier ÔGravel
on:
  schedule:
    - cron: '15 5,10,16,20 * * *'  # 7h15, 12h15, 18h15, 22h15 (heure d'été ; une heure plus tôt en hiver)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python update.py
      # Le fichier d'abonnement est régénéré ici : un enregistrement fait par
      # le robot ne déclenche pas l'autre workflow (règle de GitHub).
      - run: python generer_ics.py
      # GPX déposés dans le dossier « gpx » du Google Drive ÔGravel -> onglet Parcours.
      # Une panne du Drive ne bloque pas la mise à jour du calendrier.
      - run: python gpx_drive.py
        continue-on-error: true
      # Photos de l'album Google ÔGravel -> carrousel de l'onglet Photos.
      - run: python photos.py
        continue-on-error: true
      - name: Publier les nouvelles dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json ogravel.ics app/parcours.json $(ls app/photos.json 2>/dev/null) $(ls sorties-historique.json gpx-cache.json 2>/dev/null)
          git diff --cached --quiet || (git commit -m "Actualiser les sorties" && git push)
